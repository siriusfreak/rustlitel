version: 2
updates:
  # Rust dependencies across the workspace (reads Cargo.toml / Cargo.lock).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
  # Keep the GitHub Actions in the build workflow current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
