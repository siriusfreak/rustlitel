<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>rustlitel</title>
    <link data-trunk rel="rust" data-bin="rustlitel-ui" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: block;
      }
      /* Under the canvas, which covers it with its first frame. */
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 14px system-ui, sans-serif;
        color: #858d9a;
      }
      /* First-paint background; egui paints over it once the wasm loads. */
      body {
        background: #11151c;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #eef0f2;
        }
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading rustlitel…</div>
    <canvas id="canvas"></canvas>
    <script>
      // The on-screen keyboard shrinks only the visual viewport. Fit the page to
      // it, or the bottom of the terminal, cursor included, stays under the keyboard.
      if (window.visualViewport) {
        const fit = () => {
          const h = window.visualViewport.height + "px";
          document.documentElement.style.height = h;
          document.body.style.height = h;
          window.scrollTo(0, 0);
        };
        window.visualViewport.addEventListener("resize", fit);
        window.visualViewport.addEventListener("scroll", fit);
      }
    </script>
  </body>
</html>
