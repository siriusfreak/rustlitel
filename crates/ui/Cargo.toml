[package]
name = "rustlitel-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rustlitel-ui"
path = "src/main.rs"

[dependencies]
egui = "0.36"
eframe = { version = "0.29", default-features = false, features = [
    "glow",          # WebGL renderer
    "persistence",   # remember the theme choice in localStorage
    "default_fonts", # egui's built-in fonts (dropped by default-features=false)
] }
ehttp = "0.5"
ewebsock = "0.8"
vt100 = "0.15"
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"

# Built only for wasm32 (via Trunk); eframe selects its web backend by target,
# so the native windowing deps never compile.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "MediaQueryList",
    "Location",
] }
console_error_panic_hook = "0.1"
console_log = "1"
