[package]
name = "rustlitel-relay"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rustlitel-relay"
path = "src/main.rs"

[dependencies]
rustlitel-proto = { path = "../proto" }
tokio = { workspace = true }
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures-util = { workspace = true }
subtle = "2"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
# OIDC (Keycloak) operator login: HTTP to the IdP + RS256 ID-token verification.
# reqwest's rustls-tls brings its own aws-lc-rs provider, so no manual provider.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# jsonwebtoken 11's default features enable NO crypto backend, so RS256 verify
# panics at runtime ("determine the process-level CryptoProvider"). Pin the
# aws-lc-rs backend — already in the tree via reqwest/rustls, and (unlike
# rust_crypto) it pulls no `rsa` crate, so `cargo audit` stays clean.
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
url = "2"
