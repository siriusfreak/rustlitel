[workspace]
resolver = "2"
members = ["crates/proto", "crates/relay", "crates/agent", "crates/cli", "crates/ui"]
# The egui/eframe UI only ever targets wasm32 (built with Trunk). Keep it out of
# the default set so a plain `cargo build`/`test` doesn't drag in eframe's native
# windowing stack; Trunk and the Dockerfile build the crates they need by name.
default-members = ["crates/proto", "crates/relay", "crates/agent", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/siriusfreak/rustlitel"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
